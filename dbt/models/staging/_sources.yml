version: 2

sources:
  - name: ga4
    description: >
      Google's public GA4 export from the Google Merchandise Store, obfuscated for privacy.
      One table per day named events_YYYYMMDD, covering 2020-11-01 to 2021-01-31.
    database: bigquery-public-data
    schema: ga4_obfuscated_sample_ecommerce
    tables:
      - name: events
        identifier: "events_*"
        description: Wildcard over every daily events table. Filter with _table_suffix.
