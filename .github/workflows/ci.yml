name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Checks every model, ref, macro, test and YAML file without touching BigQuery,
      # so CI needs no cloud credentials.
      - name: dbt parse
        run: dbt parse --project-dir dbt --profiles-dir dbt
        env:
          GCP_PROJECT: ci-placeholder

      - name: Check the chart script compiles
        run: python -m py_compile analysis/report.py
